<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 12 646 142" width="100%" height="100%">
  <defs>
    <!-- Brand Gradient for 'RADAR' and Accent Elements -->
    <linearGradient id="radarBrandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FA935A" />
      <stop offset="50%" stop-color="#D6456E" />
      <stop offset="100%" stop-color="#481D4A" />
    </linearGradient>

    <!-- Radar Sweep Glow Gradient -->
    <linearGradient id="sweepGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D6456E" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FA935A" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filter for subtle drop shadow on accent dot -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Spectral:wght@600;700;800&amp;family=IBM+Plex+Sans:wght@700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap');

      .text-burnout {
        font-family: 'Spectral', Georgia, serif;
        font-size: 58px;
        font-weight: 700;
        fill: #1B365D;
        letter-spacing: -0.5px;
      }

      .text-radar {
        font-family: 'IBM Plex Sans', -apple-system, sans-serif;
        font-size: 58px;
        font-weight: 800;
        fill: url(#radarBrandGrad);
        letter-spacing: 2px;
      }

      .text-tagline {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 13.5px;
        font-weight: 600;
        fill: #767B87;
        letter-spacing: 4.5px;
        text-transform: uppercase;
      }

      .radar-arc {
        fill: none;
        stroke: url(#radarBrandGrad);
        stroke-width: 3;
        stroke-linecap: round;
      }

      .radar-arc-dashed {
        fill: none;
        stroke: #D6456E;
        stroke-width: 1.5;
        stroke-dasharray: 4, 4;
        opacity: 0.6;
      }
    </style>
  </defs>

  <!-- Clean Background (Transparent) -->
  <rect width="680" height="160" fill="none" />

  <!-- Subtle Integrated Geometric Radar Motif Above 'RADAR' -->
  <g transform="translate(425, 48)">
    <!-- Radar concentric arcs integrated into the typography -->
    <path d="M -30 0 A 30 30 0 0 1 30 0" class="radar-arc-dashed" />
    <path d="M -18 0 A 18 18 0 0 1 18 0" class="radar-arc" stroke-width="2.5" />
    <circle cx="0" cy="0" r="4.5" fill="#FA935A" filter="url(#softGlow)" />
    <!-- Fine beam angle -->
    <line x1="0" y1="0" x2="22" y2="-22" stroke="#D6456E" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Main Logotype Text -->
  <text x="24" y="98">
    <tspan class="text-burnout">Burnout</tspan>
    <tspan dx="16" class="text-radar">RADAR</tspan>
  </text>

  <!-- Accent Divider & Subtitle -->
  <line x1="26" y1="122" x2="80" y2="122" stroke="#FA935A" stroke-width="2.5" stroke-linecap="round" />
  <line x1="88" y1="122" x2="656" y2="122" stroke="#E9E2DC" stroke-width="1" />
  
  <text x="26" y="146" class="text-tagline">AI Mental Health &amp; Risk Stratification</text>
</svg>
